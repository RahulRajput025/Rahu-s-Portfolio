    <script>
      // Runs before first paint: stored theme → OS preference → dark.
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('rr-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          d.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#F8F5EF' : '#070B14');
          if (localStorage.getItem('rr-motion') === 'reduced') d.setAttribute('data-motion', 'reduced');
        } catch (e) {}
      })();
    </script>
