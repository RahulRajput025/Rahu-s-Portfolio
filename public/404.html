<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Rahul Rajput</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem('rr-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      :root { --ground: #070b14; --ink: #f4f0e8; --ink-soft: #abb3c2; --copper: #e39b62; --rule: #1e2a40; color-scheme: dark; }
      [data-theme="light"] { --ground: #f8f5ef; --ink: #0f172a; --ink-soft: #4b5567; --copper: #a0542a; --rule: #ddd6c9; color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--ground); color: var(--ink); font-family: Georgia, "Times New Roman", serif; padding: 24px; }
      main { max-width: 560px; text-align: left; }
      .num { font-size: clamp(5rem, 22vw, 11rem); line-height: 0.9; font-weight: 300; letter-spacing: -0.02em; margin: 0 0 1.25rem; color: var(--copper); }
      @supports (background-clip: text) {
        .num { background: linear-gradient(105deg, #5a2e17 0%, #c9834f 22%, #f3c5a2 34%, #b86a3a 48%, #6b3a1e 62%, #e1a273 82%, #8a4b2b 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      }
      h1 { font-weight: 300; font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 0.75rem; }
      p { font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; letter-spacing: 0.04em; color: var(--ink-soft); margin: 0 0 2rem; }
      a { color: var(--copper); text-decoration: none; border-bottom: 1px solid var(--rule); padding-bottom: 2px; font-family: system-ui, sans-serif; font-size: 1rem; }
      a:hover, a:focus-visible { border-color: var(--copper); }
    </style>
  </head>
  <body>
    <main>
      <div class="num" aria-hidden="true">404</div>
      <h1>This page doesn’t exist.</h1>
      <p>Nothing is wired to this address.</p>
      <a href="./">Back to the start →</a>
    </main>
  </body>
</html>
